name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # The real Electron on the local address page: no network, a throwaway data
      # directory, exit 0 only if the page and both bridges are as expected. The runner
      # has no configured setuid sandbox, hence --no-sandbox for this check only.
      - name: Electron smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --no-sandbox --smoke-test --user-data-dir="$RUNNER_TEMP/gome-remote-smoke"
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: gome-remote-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
  # The Mac agent (agent/mac) needs the macOS frameworks, so it is built and tested on a
  # macOS runner only. Everything runs with --locked: the committed Cargo.lock is what builds.
  agent-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent/mac
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/mac/target
          key: agent-mac-${{ runner.os }}-${{ hashFiles('agent/mac/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The development-install build reads its settings from a user directory instead.
      - run: cargo test --locked --features dev-install
      # The installer runs under the system bash (3.2) on a Mac, not the newer one on PATH.
      - run: /bin/bash -n install.sh uninstall.sh
      # Pinned: deny.toml is validated against this version; a newer release could change
      # the checks and turn CI red without any change here. Raise it together with deny.toml.
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
