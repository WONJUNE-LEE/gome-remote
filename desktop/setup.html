<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Local page with no remote content; its inline script only writes text with textContent. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gome Remote</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f3;
        --ink: #1a1a1a;
        --muted: #5f5f5f;
        --field: #ffffff;
        --control: #d1d1d1;
        --accent: #c2410c;
        --accent-ink: #ffffff;
        --error: #c42b1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202020;
          --ink: #f2f2f2;
          --muted: #b5b5b5;
          --field: #2b2b2b;
          --control: #4a4a4a;
          --error: #ff99a4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 "Segoe UI Variable Text",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans KR",
          sans-serif;
      }
      /* The window's title bar on Windows and Linux, where the OS draws the caption
         buttons over its right end (the window controls overlay, class "wco"); a plain
         bar on the Mac. */
      header {
        flex-shrink: 0;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        padding-right: calc(
          100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw)
        );
        font-size: 12px;
        user-select: none;
      }
      .wco header {
        -webkit-app-region: drag;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: min(420px, 90vw);
        margin: auto;
        padding-bottom: 40px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 28px;
        font-weight: 600;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      input {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--control);
        border-radius: 6px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }
      button {
        margin-top: 12px;
        height: 36px;
        padding: 0 18px;
        border: 1px solid var(--control);
        border-radius: 6px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #error {
        min-height: 1.5em;
        margin: 10px 0 0;
        color: var(--error);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark"
        ><svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.4"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path d="M9 20h6M12 16v4" /></svg
      ></span>
      Gome Remote
    </header>
    <main>
      <h1 id="title">서버 주소</h1>
      <p id="current" hidden></p>
      <button id="retry" class="primary" type="button" hidden>다시 시도</button>
      <form id="form">
        <label for="address">서버 주소</label>
        <input
          id="address"
          type="text"
          inputmode="url"
          placeholder="your-server.your-tailnet.ts.net:8450"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <p id="error" role="alert"></p>
        <button id="save" class="primary" type="submit">열기</button>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      if (
        typeof navigator === "object" &&
        navigator.windowControlsOverlay &&
        navigator.windowControlsOverlay.visible
      )
        document.body.classList.add("wco");
      const setup = window.desktopSetup;
      const readable = (error) =>
        String((error && error.message) || error).replace(
          /^Error invoking remote method '[^']+': (Error: )?/,
          "",
        );
      const unreachable =
        new URLSearchParams(location.search).get("reason") === "unreachable";
      setup
        .current()
        .then((address) => {
          $("address").value = address;
          if (unreachable && address) {
            $("title").textContent = "서버에 연결할 수 없습니다";
            $("current").textContent = address;
            $("current").hidden = false;
            $("retry").hidden = false;
          }
        })
        .catch((error) => {
          $("error").textContent = readable(error);
        });
      $("retry").onclick = () => {
        setup.retry().catch((error) => {
          $("error").textContent = readable(error);
        });
      };
      $("form").onsubmit = async (event) => {
        event.preventDefault();
        $("error").textContent = "";
        $("save").disabled = true;
        try {
          await setup.save($("address").value);
        } catch (error) {
          $("error").textContent = readable(error);
          $("save").disabled = false;
        }
      };
    </script>
  </body>
</html>
