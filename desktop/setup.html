<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Local page with no remote content; its inline script only writes text with textContent. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gome Remote</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ee;
        --ink: #2b2723;
        --muted: #7a7168;
        --field: #ffffff;
        --line: #ddd5ca;
        --accent: #2b2723;
        --accent-ink: #ffffff;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #22201e;
          --ink: #f0ebe4;
          --muted: #a39a90;
          --field: #2e2b28;
          --line: #433f3a;
          --accent: #f0ebe4;
          --accent-ink: #22201e;
          --error: #f2b8b5;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 Inter,
          "Noto Sans KR",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(420px, 90vw);
      }
      h1 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }
      button {
        margin-top: 12px;
        padding: 11px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #error {
        min-height: 1.5em;
        margin: 10px 0 0;
        color: var(--error);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">서버 주소</h1>
      <p id="current" hidden></p>
      <button id="retry" class="primary" type="button" hidden>다시 시도</button>
      <form id="form">
        <label for="address">서버 주소</label>
        <input
          id="address"
          type="text"
          inputmode="url"
          placeholder="your-server.your-tailnet.ts.net:8450"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <p id="error" role="alert"></p>
        <button id="save" class="primary" type="submit">열기</button>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const setup = window.desktopSetup;
      const readable = (error) =>
        String((error && error.message) || error).replace(
          /^Error invoking remote method '[^']+': (Error: )?/,
          "",
        );
      const unreachable =
        new URLSearchParams(location.search).get("reason") === "unreachable";
      setup
        .current()
        .then((address) => {
          $("address").value = address;
          if (unreachable && address) {
            $("title").textContent = "서버에 연결할 수 없습니다";
            $("current").textContent = address;
            $("current").hidden = false;
            $("retry").hidden = false;
          }
        })
        .catch((error) => {
          $("error").textContent = readable(error);
        });
      $("retry").onclick = () => {
        setup.retry().catch((error) => {
          $("error").textContent = readable(error);
        });
      };
      $("form").onsubmit = async (event) => {
        event.preventDefault();
        $("error").textContent = "";
        $("save").disabled = true;
        try {
          await setup.save($("address").value);
        } catch (error) {
          $("error").textContent = readable(error);
          $("save").disabled = false;
        }
      };
    </script>
  </body>
</html>
